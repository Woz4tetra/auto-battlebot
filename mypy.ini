# mypy configuration, mirroring Pickle-Robot conventions.
# Strict-by-default: untyped defs are errors, unused ignores/casts warn, and
# unreachable code is flagged. Third-party libraries without type stubs are
# silenced per-module below. The playground/ directory is intentionally excluded.
[mypy]
python_version = 3.10
files = simulation, scripts
exclude = (^|/)(\.?venv|build|build-test|dist|__pycache__|playground|data)/
warn_unused_configs = True
warn_return_any = True
follow_imports = normal
namespace_packages = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
check_untyped_defs = True
allow_untyped_defs = False
explicit_package_bases = True
local_partial_types = True

[mypy-genesis.*]
ignore_missing_imports = True

[mypy-dacite.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-mcap.*]
ignore_missing_imports = True

[mypy-mcap_ros1.*]
ignore_missing_imports = True

[mypy-tensorrt.*]
ignore_missing_imports = True

[mypy-pycuda.*]
ignore_missing_imports = True

# Sibling-script import (training/model_eval/compare_cpp_python.py imports score.py);
# resolvable at runtime via the script dir, not as an installed module.
[mypy-score]
ignore_missing_imports = True

# NHRL distractor pipeline sibling-script imports (training/synthetic/*.py),
# resolvable at runtime via the script dir, not as installed modules.
[mypy-nhrl_common]
ignore_missing_imports = True

[mypy-nhrl_audit]
ignore_missing_imports = True
