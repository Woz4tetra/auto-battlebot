; auto-battlebot velocity jig
; Feather RP2040 Adalogger (PID 5980), arduino-pico core (Earle Philhower)
; Wiring: docs/velocity_jig_wiring.md

[env:adalogger]
; Philhower core is provided through maxgerhardt's platform fork.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
board_build.core = earlephilhower
framework = arduino

; The Adalogger is pin-identical to the Feather RP2040 for our purposes
; (8MB flash). If your PlatformIO install lists a dedicated board id, prefer it:
;   pio boards adafruit | grep -i adalogger

monitor_speed = 921600
; Add -DVJIG_DEBUG=1 for serial bring-up trace (waits for the monitor at boot).
; Leave it off for normal use so the console TUI has a quiet serial line.
build_flags = -O2 -Wall

lib_deps =
    ; ISM330DHCX driver (Adafruit_ISM330DHCX.h) ships inside the LSM6DS library
    adafruit/Adafruit LSM6DS
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library
    greiman/SdFat @ ^2.2.2
