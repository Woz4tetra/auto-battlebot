[platformio]
default_envs = qtpy_esp32s3
src_dir = .

[env:qtpy_esp32s3]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
lib_deps =
    plerup/espsoftwareserial
; USB-Serial/JTAG instead of TinyUSB, as in mr_stabs_mk2: esptool resets the chip into its ROM
; bootloader through it without the BOOT button (glued on the robot), so the robot firmware can
; always be flashed back.
build_flags =
    -I ESP32
    -DARDUINO_USB_MODE=1
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.before_reset = usb_reset
build_src_filter =
    +<src/main.cpp>
    +<ESP32/4Way.cpp>
    +<ESP32/MSP.cpp>
    +<ESP32/serial_comm.cpp>
    +<ESP32/ESC_Serial.cpp>
    +<ESP32/Global.cpp>
