extends = "_zed_box"

[field_filter]
type = "HomographyFieldFilter"
field_size_x = 1.5
field_size_y = 1.5

[robot_filter.label_mapping]
"MRS_BUFF_MK3" = ["THEIR_ROBOT_1"]
"MR_STABS_MK2" = ["OUR_ROBOT_1"]

[transmitter]
# Commands go out over the ESP-NOW dongle alone. The handset talks only to the robot: it arms, holds
# the link failsafe, and SA hands the wheels to these commands. Feedback and the SA state come back
# in the robot's telemetry. The type differs from _common, so the merge replaces this section and
# every field is restated.
type = "EspNowTransmitter"
dongle_serial_path = "/dev/espnow_dongle"
# The radio model mixes linear/angular into the motor outputs, so send body axes.
drive_processor = "DifferentialDriveProcessor"
lifted_deadzone_percent = 0
zero_deadzone_percent = 2
reverse_angular_channel = true
velocity_saturation_limit = 1.0                # 0 = disabled; e.g. 1.0 = |linear| + |angular| <= 1

[plant]
dz_lin_fwd = 0.00938353
dz_lin_rev = 0.0
dz_ang_l = 0.0
dz_ang_r = 0.0
k_fwd = 5.7302
k_rev = 3.75736
k_ang = 38.9057
tau_lin_a = 0.182874
tau_lin_d = 0.0684365
tau_ang_a = 0.0588077
tau_ang_d = 0.0610599
delay_s = 0.016
c_sb = 1.36475
c_ad = 0.195197
c_drift = 0.0
c_drift_bias = 0.0
