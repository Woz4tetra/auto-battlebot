# Shared base for all profiles. Not run directly: every profile sets `extends = "_common"`
# (directly or transitively) and overrides only its deltas. `model_path` is profile-specific
# (architecture/date), so it lives in the profiles rather than here.
#
# Merge rules (see src/config/config.cpp):
#   - scalars and arrays in a profile replace the value here
#   - a section whose `type` differs from here is replaced wholesale (stale fields dropped)
#   - sub-tables are merged by key. When overriding [robot_filter.label_mapping] a profile must
#     restate every key it wants, since keys present here but omitted there would persist.

[rgbd_camera]
type = "ZedRgbdCamera"
camera_fps = 30

[field_filter]
type = "PointCloudFieldFilter"
local_visualize_debug = false
distance_threshold = 0.05

[field_model]
type = "DeepLabMaskModel"

[robot_mask_model]
type = "YoloBboxRobotBlobModel"

[keypoint_model]
type = "YoloKeypointModel"
label_indices = ["MR_STABS_MK2", "MRS_BUFF_MK3"]

[[keypoint_model.label_map]]
label = "MR_STABS_MK2"
keypoints = ["MR_STABS_MK2_FRONT", "MR_STABS_MK2_BACK"]

[[keypoint_model.label_map]]
label = "MRS_BUFF_MK3"
keypoints = ["MRS_BUFF_MK3_FRONT", "MRS_BUFF_MK3_BACK"]

[[keypoint_model.label_map]]
label = "HOUSE_BOT"
keypoints = ["HOUSE_BOT_FRONT", "HOUSE_BOT_BACK"]

[[keypoint_model.label_map]]
label = "OPPONENT"
keypoints = ["OPPONENT_FRONT", "OPPONENT_BACK"]

[robot_filter]
type = "RobotFrontBackFilter"
default_frame_id = "OUR_ROBOT_1"

front_keypoints = [
  "MR_STABS_MK2_FRONT",
  "MRS_BUFF_MK3_FRONT",
  "HOUSE_BOT_FRONT",
  "OPPONENT_FRONT",
]
back_keypoints = [
  "MR_STABS_MK2_BACK",
  "MRS_BUFF_MK3_BACK",
  "HOUSE_BOT_BACK",
  "OPPONENT_BACK",
]

robot_blob_min_length_meters = 0.08
robot_blob_max_length_meters = 0.7
robot_blob_min_confidence = 0.4
robot_blob_max_candidates = 8
blob_overwrite_min_distance_meters = 0.20
blob_overwrite_size_scale = 0.5
field_bounds_margin_meters = 0.5
# Drop a stale (unmeasured) our-robot track after this long without a keypoint confirmation,
# instead of predicting it forward indefinitely. Set <= 0 to hold forever (legacy behavior).
our_robot_hold_window_s = 0.15

# While the keypoint model is not detecting our robot, discard blob detections within this
# radius of our last held pose. The blob model cannot tell our robot from an opponent, so an
# unsuppressed blob here gets emitted as an opponent sitting on top of us. The window outlives
# our_robot_hold_window_s deliberately: the track decays before a typical dropout ends.
our_keypoint_dropout_blob_radius_meters = 0.4
our_keypoint_dropout_blob_window_s = 1.0

# Tracked keypoints sit this far above the field plane by default.
keypoint_height_meters = 0.03

# Propagation strategy between perception frames. Absent means DeadReckoningMotionEstimator
# (last commanded velocity applied directly, opponents held at their last pose). The Kalman
# arm runs opponents through a constant-velocity filter with innovation gating and coasts the
# output at control rate; our robot still dead-reckons until the plant fit passes acceptance.
# The jig-fitted plant parameters ride in the shared top-level [plant] table below.
[robot_filter.motion_estimator]
type = "KalmanMotionEstimator"
our_robot_mode = "EKF"

# Per-label keypoint height overrides; labels not listed use keypoint_height_meters.
[robot_filter.keypoint_height_meters_per_label]
HOUSE_BOT = 0.12
MR_STABS_MK1 = 0.0
MR_STABS_MK2 = 0.0
MRS_BUFF_MK1 = 0.0
MRS_BUFF_MK2 = 0.0
MRS_BUFF_MK3 = 0.0

[robot_filter.label_mapping]
"HOUSE_BOT" = ["NEUTRAL_ROBOT_1"]
"OPPONENT" = ["THEIR_ROBOT_1", "THEIR_ROBOT_2", "THEIR_ROBOT_3"]

[target_selector]
type = "SafestPointTarget"

[transmitter]
type = "OpenTxTransmitter"
# TankDriveProcessor sends left/right motor commands on the two output channels.
# DifferentialDriveProcessor sends linear/angular for a radio model that mixes them itself.
drive_processor = "TankDriveProcessor"
# Channel mapping (0-based config index = radio channel label - 1).
linear_channel = 0              # radio CH1
angular_channel = 1             # radio CH2
trainer_enable_channel = 5      # radio CH6
behavior_mode_channel = 6       # radio CH7, attack vs run away
init_button_channel = 31        # disabled; no transmitter maps a button, reinit is a touchscreen action
max_motor_rpm = 1500            # RPM
max_motor_rpm_per_sec = 3000    # RPM/s
lifted_deadzone_percent = 5
zero_deadzone_percent = 2
reverse_angular_channel = true
velocity_saturation_limit = 1.0 # 0 = disabled; e.g. 1.0 = |linear| + |angular| <= 1

# The measured drivetrain, read by two subsystems: the our-robot EKF propagates through it and
# MotionProfileNavigation inverts it for the brake schedule and feedforward. One table, so a
# refit lands in one place.
#
# Stage A per-phase fit, playground/calibration/out/plant_stageA.toml, sessions 2026-08-19
# through 2026-08-23, model M4 (drift terms disabled by the ladder, written as zero). The fit
# is the source of truth: refit and re-copy, do not hand-edit. Measured with guard plates on;
# their ground friction is part of the fitted plant. delay_s is the onset-stack measurement
# (3486 edges, SNR 22.4), corroborated by the tau-pinned profile (54 ms) and the stage 2
# camera value (59 ms).
[plant]
dz_lin_fwd = 0.0109768
dz_lin_rev = 0.0253396
dz_ang_l = 0.016061
dz_ang_r = 0.0240734
k_fwd = 4.88002
k_rev = 4.3546
k_ang = 31.7062
tau_lin_a = 0.14921
tau_lin_d = 0.123461
tau_ang_a = 0.173867
tau_ang_d = 0.0878998
delay_s = 0.0522094
c_sb = 2.70197
c_ad = 0.463423
c_drift = 0.0
c_drift_bias = 0.0

# fit_process_noise.py output, playground/calibration/out/process_noise.toml, same sessions
# and plant as above; only the EKF reads them. Growth-law mechanisms: white-noise accel (h^3), scale-factor error on
# v and w (h^2, applied state-dependent at runtime), heading random walk (h), delay jitter
# (constant, fit found none). Refit and re-copy, do not hand-edit.
[plant.process_noise]
q_along = 0.37125
q_cross = 0.351167
q_heading = 0.0
scale_factor = 0.541056
heading_scale_factor = 1.7783
heading_random_walk = 0.0703417
delay_jitter_s = 0.0

# Motion-profiled tracker: a distance-to-go brake schedule and inverse-plant feedforward, both
# derived from the jig fit. See docs/plant_backed_control.md. The plant terms come from the
# [plant] table above, not from here, so only the mission and field settings live below.
#
# Mr Stabs Mk2 has no fit and stays on PursuitNavigation. Its profiles set `type` themselves,
# which makes the merge replace this whole section rather than merge keys into it.
[navigation]
type = "MotionProfileNavigation"
stop_distance = 0.15             # arrive stopped within this distance of the goal
# Terminal speed at the goal, per driver switch position: hit it, or get away from it and
# hold. A fraction of the plant's k_fwd, clamped to 0..1: 0 = arrive stopped, 1 = full
# speed. Normalized rather than m/s so a refit rescales these instead of leaving a
# hand-copied speed stale.
attack_terminal_speed_fraction = 1.0   # full forward speed into the opponent
run_away_terminal_speed_fraction = 0.0 # arrive stopped at the safe point
wall_reverse_distance = 0.25           # set > 0 to reverse when within this distance of any wall
wall_heading_threshold = 1.047         # ~60 deg; heading must point toward wall to trigger reversal
wall_reverse_min_speed = 0.25
max_linear_command = 1.0               # 0 = no limit
max_angular_command = 1.0              # 0 = no limit

[publisher]
type = "RosPublisher"

[runner]
max_loop_rate = 60.0               # set to double of camera FPS
default_opponent_count = 1
autonomy_enabled_by_default = true
# Run the keypoint and robot blob models on parallel worker threads. false = sequential.
parallel_models = true

[mcap]
enable = false
ignored_topics = ["/camera/image"]

[health]
enable = true
tegrastats_enable = false
x86_tools_enable = true   # auto detects if system is x86
sample_period_ms = 500
