# Ground-truth labeling profile for detector evaluation. Extends playback with MCAP recording
# on and /camera/image kept (the label editor needs the frames), UI off, SVO replayed as fast
# as possible. Message stamps come from the SVO frame stamp, so the exported labels align
# frame-exactly with any candidate run of the same SVO.
# Pair with training/model_eval/export_labels.py and edit_labels.py.
extends = "playback/_playback"

[rgbd_camera]
svo_real_time_mode = false

[ui]
enable = false

[mcap]
enable = true
ignored_topics = []
