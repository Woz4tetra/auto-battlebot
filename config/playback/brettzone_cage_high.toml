# Replay of NHRL's fixed `Cage-N-Overhead-High` footage, re-wrapped into the
# recording layout by scripts/nhrl_to_recordings.py. The nearest thing to the RGB camera that
# exists before the camera does: one fixed 1080p view, no depth, no visual odometry.
#
# Two things this footage cannot give you. The intrinsics in
# config/cameras/brettzone_cage_high.toml are backed out of NHRL's stated field of view rather
# than measured, and the homography path inherits that error linearly, so treat ranges as
# indicative. And the detectors were trained on ZED frames at a different mount, so detections here
# report transfer rather than accuracy.
#
# Regenerated by scripts/nhrl_to_recordings.py; edits to the clip list will not survive a re-run.
extends = "playback/_video_playback"

[rgbd_camera]
# video_file_path = "data/saved_recordings/BrettZone_2026-05/BZ-nhrl_may26_3lb-clyde-mrsbuff-EX-5308076041394ef4-Cage-2-Overhead-High.mcap"
# video_file_path = "data/saved_recordings/BrettZone_2026-05/BZ-nhrl_may26_3lb-mrsbuff-ironwarrior-W-17-Cage-2-Overhead-High.mcap"
# video_file_path = "data/saved_recordings/BrettZone_2026-05/BZ-nhrl_may26_3lb-mrsbuff-johnundercutter-W-52-Cage-2-Overhead-High.mcap"
video_file_path = "data/saved_recordings/BrettZone_2026-05/BZ-nhrl_may26_3lb-mrsbuff-sphinx-EX-2b8f8f9c1af74179-Cage-5-Overhead-High.mcap"
# video_file_path = "data/saved_recordings/BrettZone_2026-05/BZ-nhrl_may26_3lb-stingoperation-mrsbuff-W-40-Cage-2-Overhead-High.mcap"
# video_file_path = "data/saved_recordings/BrettZone_2026-05/BZ-nhrl_may26_3lb-wreckcreation-mrsbuff-EX-21ee8a65cb5a4f40-Cage-2-Overhead-High.mcap"
start_frame = 0

[robot_mask_model]
# Without this every detection is classified OTHER and dropped before it becomes a keypoint,
# however confident the model was. debug_visualization draws the raw detections, so the symptom is
# a annotated frame full of boxes and an empty filter.
their_robot_labels = ["OPPONENT"]

[robot_filter.label_mapping]
# Sub-tables merge by key, so OPPONENT and HOUSE_BOT from _common.toml survive this.
"MRS_BUFF_MK3" = ["OUR_ROBOT_1"]

[field_filter]
# The outline fit rather than the board: there is no fiducial board in broadcast footage.
type = "HomographyFieldFilter"
field_size_x = 2.35
field_size_y = 2.35
