# Shared simulation base (not run directly): SimRgbdCamera over a socket, x86 engines, swapped team
# mapping, sim transmitter. Navigation tuning and transmitter startup delay are NOT defined here so
# they don't leak into every sim profile; leaf configs (genesis.toml, headless_sim.toml) set their own.
extends = "common"

# Type change -> replaces common's ZedRgbdCamera.
[rgbd_camera]
type = "SimRgbdCamera"
sim_host = "127.0.0.1"
sim_port = 14882

[field_model]
type = "YoloSegMaskModel"
model_path = "data/models/yolo26n-seg_nhrl_field_2026-04-16_x86_64_sm89.engine"
label_indices = ["FIELD", "OPPONENT", "HOUSE_BOT"]

[robot_mask_model]
type = "YoloSegRobotBlobModel"
model_path = "data/models/yolo26n-seg_nhrl_robots_2026-04-26_x86_64_sm89.engine"
label_indices = [
  "OPPONENT",
  "OPPONENT",
  "HOUSE_BOT",
  "MR_STABS_MK2",
  "OPPONENT",
]
their_robot_labels = ["OPPONENT"]
neutral_robot_labels = ["HOUSE_BOT"]
field_labels = ["FIELD"]

[keypoint_model]
model_path = "data/models/yolo26n-pose_our_robots_2026-04-24_x86_64_sm89.engine"

# Swapped vs common (our/their robot identities are flipped in sim). Restate every key, since
# label_mapping is merged by key.
[robot_filter.label_mapping]
"MR_STABS_MK2" = ["OUR_ROBOT_1"]
"MRS_BUFF_MK3" = ["THEIR_ROBOT_1"]
"HOUSE_BOT" = ["NEUTRAL_ROBOT_1"]
"OPPONENT" = ["THEIR_ROBOT_1", "THEIR_ROBOT_2", "THEIR_ROBOT_3"]

[transmitter]
type = "SimTransmitter"
command_delay_ms = 0.0

[ui]
enable = false
fullscreen = false
battery_source = "None"

[mcap]
enable = false
ignored_topics = []
