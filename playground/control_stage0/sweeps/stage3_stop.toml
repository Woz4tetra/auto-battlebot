# Stage 3 scenario 1: zero-velocity stop, baseline (PursuitNavigation) vs tracker
# (MotionProfileNavigation). Same "go to X and stop" geometries as goto_stop.toml, run under both
# control laws so results.csv shows them side by side.
#
# Baseline replays the Stage 2 tuning (brake_distance = 0.8, max_angular_command = 0.25). The tracker
# replaces the whole [navigation] section (type differs, so the config merge drops the pursuit
# fields) and derives its brake schedule from the measured plant (tau_decel + latency), so it needs
# no hand-set brake_distance. Its plant defaults already match kinematic_sim_mr_stabs_mk2.toml
# (5.6/4.84 m/s, tau_accel 0.058, tau_decel 0.078, latency 0.06).
#
# Compare in results.csv: terminal_pos_err_m, terminal_vel_mps, overshoot_m, t_to_goal_s, wall_contacts.
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/stage3_stop.toml --out playground/control_stage0/sweep_out/stage3_stop

sim_config = "simulation/kinematic_sim_mr_stabs_mk2.toml"

# --- stop_short: -0.5,-0.5 -> 0,0 ---
[[runs]]
name = "short_baseline"
[runs.sim]
"our_robot.start_pos" = [-0.5, -0.5]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.8

[[runs]]
name = "short_tracker"
[runs.sim]
"our_robot.start_pos" = [-0.5, -0.5]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
"navigation.max_angular_command" = 0.25

# --- stop_center: -0.9,-0.9 -> 0,0 ---
