# "Go to X and stop" missions for MR STABS MK2 (Stage 1b/2 of the control improvement plan).
#
# Drive from a start pose to a fixed goal and stop on it with zero terminal velocity. The goal is a
# static opponent; navigation.stop_distance makes PursuitNavigation cut the command near it.
#
# Control fixes exercised here (Stage 2), needed because the calibrated plant is aggressive
# (5.6 m/s, 61.5 rad/s):
#   - navigation.max_angular_z: caps the angular command so a committed turn does not overshoot the
#     heading in the 30 Hz + latency loop (0.25 * 61.5 rad/s ~= 15 rad/s effective).
#   - navigation.brake_distance: coast-aware deceleration into the goal so the robot does not blast
#     through the stop zone at full speed and coast past (~ the 0.78 m stopping lead).
#
# Metrics in results.csv: terminal_pos_err_m, terminal_vel_mps, overshoot_m, t_to_goal_s, wall_contacts.

sim_config = "simulation/kinematic_sim_mr_stabs_mk2.toml"

[[runs]]
name = "stop_short"
[runs.sim]
"our_robot.start_pos" = [-0.5, -0.5]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15
"navigation.max_angular_z" = 0.25
"navigation.brake_distance" = 0.8

[[runs]]
name = "stop_center"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
