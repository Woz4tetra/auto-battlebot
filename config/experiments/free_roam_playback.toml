# "Free roam" field mode: fit whatever flat surface the camera points at, without the
# segmentation model. FreeRoamMaskModel selects plane pixels by a loose Lab color match
# seeded from the center of the frame; PointCloudFieldFilter's RANSAC does the rest.
# DeepLab never loads. The fitted rectangle traces the color-matched footprint, so its
# size and yaw are arbitrary in this mode. See docs/free_roam_field_mode_plan.md.
extends = "playback/_playback"

[field_model]
type = "FreeRoamMaskModel"
roi_fraction = 1.0
color_filter = true
tolerance_l = 60.0
tolerance_ab = 25.0
# debug_visualization = true  # show seed patch / color mask / final mask when tuning
