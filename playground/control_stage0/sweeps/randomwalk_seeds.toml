# Stochastic-opponent sweep: random-walk opponent under different RNG seeds at 60 ms latency.
# The seed drives both the opponent's targets and the perception noise stream, so this shows
# run-to-run variance and robustness against an unpredictable opponent.
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/randomwalk_seeds.toml --out playground/control_stage0/sweep_out/randomwalk_seeds

[[runs]]
name = "seed0"
[runs.sim]
"latency.command_ms" = 60.0
"sim.seed" = 0
opponents = [{ behavior = "random_walk", speed = 1.0 }]

[[runs]]
name = "seed1"
[runs.sim]
"latency.command_ms" = 60.0
"sim.seed" = 1
opponents = [{ behavior = "random_walk", speed = 1.0 }]

[[runs]]
name = "seed2"
[runs.sim]
"latency.command_ms" = 60.0
"sim.seed" = 2
opponents = [{ behavior = "random_walk", speed = 1.0 }]

[[runs]]
name = "seed3"
[runs.sim]
"latency.command_ms" = 60.0
"sim.seed" = 3
opponents = [{ behavior = "random_walk", speed = 1.0 }]
