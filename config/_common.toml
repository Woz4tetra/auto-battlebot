[rgbd_camera]
type = "ZedRgbdCamera"
camera_fps = 30

[field_filter]
type = "PointCloudFieldFilter"
local_visualize_debug = false
distance_threshold = 0.05

[field_model]
type = "DeepLabMaskModel"

[keypoint_model]
type = "YoloKeypointModel"
label_indices = ["MR_STABS_MK2", "MRS_BUFF_MK3"]
reference_offset_m_per_label = { MR_STABS_MK2 = -0.0455, MRS_BUFF_MK3 = 0.0104 }

[[keypoint_model.label_map]]
label = "MR_STABS_MK2"
keypoints = ["MR_STABS_MK2_FRONT", "MR_STABS_MK2_BACK"]

[[keypoint_model.label_map]]
label = "MRS_BUFF_MK3"
keypoints = ["MRS_BUFF_MK3_FRONT", "MRS_BUFF_MK3_BACK"]

[[keypoint_model.label_map]]
label = "HOUSE_BOT"
keypoints = ["HOUSE_BOT_FRONT", "HOUSE_BOT_BACK"]

[[keypoint_model.label_map]]
label = "OPPONENT"
keypoints = ["OPPONENT_FRONT", "OPPONENT_BACK"]

[keypoint_filter.height]
reject_enable = true
min_elevation_meters = 0.035
max_height_meters = 0.40
top_percentile = 0.90
floor_percentile = 0.25
ring_inner_scale = 1.4
ring_outer_scale = 2.4
sample_radius_px = 5
min_valid_samples = 8
max_circle_samples = 1024

[keypoint_filter.static]
enable = false
match_radius_meters = 0.20
static_radius_meters = 0.080
min_dwell_seconds = 4.0
min_observations = 30
responsiveness_window = 60
forget_seconds = 2.0

[robot_filter]
type = "RobotFrontBackFilter"
default_frame_id = "OUR_ROBOT_1"

front_keypoints = [
  "MR_STABS_MK2_FRONT",
  "MRS_BUFF_MK3_FRONT",
  "HOUSE_BOT_FRONT",
  "OPPONENT_FRONT",
]
back_keypoints = [
  "MR_STABS_MK2_BACK",
  "MRS_BUFF_MK3_BACK",
  "HOUSE_BOT_BACK",
  "OPPONENT_BACK",
]

field_bounds_margin_meters = 0.2

keypoint_height_meters = 0.03

[robot_filter.motion_estimator]
type = "KalmanMotionEstimator"
max_coast_s = 0.2
opponent_yaw_accel_psd = 30.0
opponent_heading_sigma_rad = 0.15
opponent_position_sigma_m = 0.012

[robot_filter.robot_size_meters_per_label]
MRS_BUFF_MK3 = [0.2225, 0.2535, 0.0861]
MR_STABS_MK2 = [0.137, 0.16, 0.0703]
HOUSE_BOT = [0.254, 0.3302, 0.2309]

[robot_filter.footprint_center_offset_per_label]
MR_STABS_MK2 = [0.043, 0.0]

[robot_filter.keypoint_height_meters_per_label]
HOUSE_BOT = 0.12
MR_STABS_MK1 = 0.0
MR_STABS_MK2 = 0.0
MRS_BUFF_MK1 = 0.0
MRS_BUFF_MK2 = 0.0
MRS_BUFF_MK3 = 0.0

[robot_filter.label_mapping]
"HOUSE_BOT" = ["NEUTRAL_ROBOT_1"]
"OPPONENT" = ["THEIR_ROBOT_1", "THEIR_ROBOT_2", "THEIR_ROBOT_3"]

[target_selector]
type = "SafestPointTarget"
retarget_improvement_m = 0.1

[transmitter]
from = "transmitters/mrs_buff_mk3_opentx"

[plant]
from = "robots/mrs_buff_mk3"

[control_loop]
type = "ThreadedControlLoop"
rate_hz = 250.0
watchdog_timeout_ms = 20.0

[navigation]
from = "navigation/motion_profile"

[publisher]
type = "FoxglovePublisher"

[ui.label_colors]
mr_stabs_mk2 = "#ea2e2e"
mrs_buff_mk3 = "#0ea5e9"
opponent = "#22c55e"
house_bot = "#f59e0b"
object = "#a855f7"

[runner]
max_loop_rate_hz = 60.0
default_opponent_count = 1
autonomy_enabled_by_default = true
default_behavior_mode = "ATTACK"
auto_tracking_by_default = true

[mcap]
enable = false
ignored_topics = ["/camera/image"]

[health]
enable = true
tegrastats_enable = false
x86_tools_enable = true
sample_period_ms = 500
