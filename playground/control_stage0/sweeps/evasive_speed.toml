# Evader-speed sweep: opponent circles the arena center; vary its speed at 60 ms latency.
# Shows how a no-lead pursuit controller falls behind a faster evader (motivates prediction).
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/evasive_speed.toml --out playground/control_stage0/sweep_out/evasive_speed

[[runs]]
name = "spd0p5"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "circle", radius = 0.6, speed = 0.5 }]

[[runs]]
name = "spd1p0"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "circle", radius = 0.6, speed = 1.0 }]

[[runs]]
name = "spd1p5"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "circle", radius = 0.6, speed = 1.5 }]

[[runs]]
name = "spd2p0"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "circle", radius = 0.6, speed = 2.0 }]
