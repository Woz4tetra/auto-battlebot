# Jetson hardware profile (aarch64 TensorRT engines). Inherits the shared perception/filter stack
# from common.toml and overrides the hardware-specific bits.
extends = "_common"

# Each model lists engine candidates instead of a single path. EngineSelector loads the
# first one that deserializes on this machine's GPU. Candidates only ever list builds of
# the same trained model: falling back to a different model would silently change
# detection behavior between machines.

[field_model]
type = "DeepLabMaskModel"

[field_model.engine]
candidates = ["data/models/field_deeplabv3p_r50_2026-07-29_aarch64_sm87.engine"]

[robot_mask_model]
type = "YoloBboxRobotBlobModel"
label_indices = ["OPPONENT", "HOUSE_BOT"]
neutral_robot_labels = ["HOUSE_BOT"]
field_labels = ["FIELD"]
confidence_threshold = 0.6
debug_visualization = false

[robot_mask_model.engine]
candidates = [
  "data/models/yolo26s_nhrl_robots_bbox_2class_rect384x640_2026-09-05_aarch64_sm87.engine",
]

[keypoint_model]
type = "YoloKeypointModel"

[keypoint_model.engine]
candidates = [
  # "data/models/yolo26n-pose_our_robot_keypoints_rect384x640_2026-09-07_aarch64_sm87.engine",
  "data/models/yolo26s-pose_our_robot_keypoints_rect384x640_2026-09-07_aarch64_sm87.engine",
  # "data/models/yolo26x-pose_our_robot_keypoints_rect384x640_2026-09-07_aarch64_sm87.engine",
]

[ui]
enable = true
fullscreen = true
battery_source = "Waveshare UPS"

[mcap]
enable = true

[health]
tegrastats_enable = true
