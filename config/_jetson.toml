# Jetson hardware profile (aarch64 TensorRT engines). Inherits the shared perception/filter stack
# from common.toml and overrides the hardware-specific bits.
extends = "_common"

[field_model]
type = "DeepLabMaskModel"
model_path = "data/models/field_deeplabv3p_r50_2026-04-29_aarch64_sm87.engine"

[robot_mask_model]
type = "YoloBboxRobotBlobModel"
model_path = "data/models/yolo26n_nhrl_robots_bbox_2026-07-16_aarch64_sm87.engine"
label_indices = [
  "OPPONENT",
  "OPPONENT",
  "HOUSE_BOT",
  "MR_STABS_MK2",
  "MRS_BUFF_MK3",
]
neutral_robot_labels = ["HOUSE_BOT"]
field_labels = ["FIELD"]
confidence_threshold = 0.6
debug_visualization = false

[keypoint_model]
type = "YoloKeypointModel"
model_path = "data/models/yolo26n-pose_our_robots_2026-05-01_aarch64_sm87.engine"

[ui]
enable = true
fullscreen = true
battery_source = "Waveshare UPS"

[mcap]
enable = true

[health]
tegrastats_enable = true
