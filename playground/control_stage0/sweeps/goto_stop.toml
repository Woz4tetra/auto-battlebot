# "Go to X and stop" missions for MR STABS MK2 (Stage 1b of the control improvement plan).
#
# Drive from a start pose to a fixed goal and stop on it with zero terminal velocity. The goal is a
# static opponent; navigation.stop_distance makes PursuitNavigation cut the command near it. This is the
# diagnostic that proves the robot can control its trajectory, and it exercises the calibrated coast
# (tau_linear_decel) that causes overrun.
#
# Metrics in results.csv: terminal_pos_err_m, terminal_vel_mps, overshoot_m, t_to_goal_s, wall_contacts.
#
# Run:
#   source scripts/activate_python.sh
#   python playground/control_stage0/sim_sweep.py \
#       --sweep playground/control_stage0/sweeps/goto_stop.toml \
#       --out playground/control_stage0/sweep_out/goto_stop

sim_config = "simulation/kinematic_sim_mr_stabs_mk2.toml"

# Baseline: short, medium, and long diagonal moves to a centered goal, stop_distance 0.15 m.
[[runs]]
name = "stop_short"
[runs.sim]
"our_robot.start_pos" = [-0.5, -0.5]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15

[[runs]]
name = "stop_center"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15

[[runs]]
name = "stop_far_diag"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.8, 0.8] }]
[runs.cpp]
"navigation.stop_distance" = 0.15

# stop_distance sweep on the medium move: shows how the stop point trades against overrun.
[[runs]]
name = "stop_center_sd05"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.05

[[runs]]
name = "stop_center_sd30"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.30
