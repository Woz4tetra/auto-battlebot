extends = "simulation/_simulation"

[field_model]
type = "FixedMaskModel"

[robot_mask_model]
type = "NoopRobotBlobModel"

[field_filter]
type = "FixedFieldFilter"
size_x = 2.4
size_y = 2.4

[keypoint_model]
type = "NoopKeypointModel"

[robot_filter]
type = "GroundTruthRobotFilter"

[transmitter]
init_delay_seconds = 0.0

[runner]
max_loop_rate_hz = 0.0

[mcap]
enable = false

[clock]
type = "ManualClock"
