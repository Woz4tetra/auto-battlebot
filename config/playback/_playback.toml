svo_real_time_mode = true

# Type change -> replaces main's OpenTxTransmitter wholesale.
[transmitter]
type = "PlaybackTransmitter"
init_delay_seconds = 0.4
lifted_deadzone_percent = 10
zero_deadzone_percent = 2
# Stands in for the radio's behavior mode switch. "ATTACK" (default) or "RUN_AWAY".
# behavior_mode = "RUN_AWAY"

[mcap]
enable = false

[ui]
# Skip the startup splash animation during replay iteration.
splash = false
