# x86_64 desktop hardware test (ZED camera on a dev machine). Sibling of main: shares common's
# camera, team mapping, and code-default health, but uses x86 YoloSeg models and relaxed nav gains.
extends = "common"

[field_model]
type = "YoloSegMaskModel"
model_path = "data/models/yolo26n-seg_nhrl_field_2026-04-16_x86_64_sm89.engine"
label_indices = ["FIELD", "OPPONENT", "HOUSE_BOT"]

[robot_mask_model]
type = "YoloSegRobotBlobModel"
model_path = "data/models/yolo26n-seg_nhrl_robots_2026-04-16_x86_64_sm89.engine"
label_indices = ["FIELD", "OPPONENT", "HOUSE_BOT"]
their_robot_labels = ["OPPONENT"]
neutral_robot_labels = ["HOUSE_BOT"]
field_labels = ["FIELD"]

[keypoint_model]
model_path = "data/models/yolo26n-pose_our_robots_2026-04-24_x86_64_sm89.engine"

[navigation]
type = "PursuitNavigation"
angular_kp = 0.1
angular_kd = 0.1
velocity_ramp_far_distance = 2.5
velocity_ramp_near_distance = 1.0
velocity_ramp_min_scale = 0.5

[transmitter]
type = "OpenTxTransmitter"
max_motor_rpm = 1500
wheel_diameter = 0.05

[ui]
enable = true
fullscreen = true
battery_source = "None"

[mcap]
enable = true
ignored_topics = ["/camera/image"]
