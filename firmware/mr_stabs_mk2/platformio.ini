; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = local

[common]
; Pin to the official espressif32 platform (Arduino core 2.x / IDF 4.4).
; The pioarduino fork (55.x, IDF 5) drops NeoPixel's rmt_reserved_channels
; and deprecates the legacy RMT driver DShot.cpp uses.
platform = espressif32@6.13.0
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit NeoPixel
    https://github.com/AlfredoSystems/AlfredoCRSF.git
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP

[env:local]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
lib_deps = ${common.lib_deps}

[env:ota]
platform = ${common.platform}
board = ${common.board}
upload_protocol = espota
framework = ${common.framework}
lib_deps = ${common.lib_deps}
