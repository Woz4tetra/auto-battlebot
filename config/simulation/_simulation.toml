# Shared simulation base (not run directly): SimRgbdCamera over a socket, x86 engines, swapped team
# mapping, sim transmitter. Navigation tuning and transmitter startup delay are NOT defined here so
# they don't leak into every sim profile; leaf configs (headless_sim.toml) set their own.
extends = "_desktop"

# Type change -> replaces common's ZedRgbdCamera.
[rgbd_camera]
type = "SimRgbdCamera"
sim_host = "127.0.0.1"
sim_port = 14882

[transmitter]
type = "SimTransmitter"
command_delay_ms = 0.0
# behavior_mode = "RUN_AWAY"


[mcap]
enable = false

[ui]
# Skip the startup splash animation during replay iteration.
splash = false
