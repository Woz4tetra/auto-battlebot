# Stage 4 ablation: turn each compensation off one at a time, on the scenario that exercises it.
#
# The plan asks for a delta per step rather than one combined number. Steps 2, 3 and 5 are all
# reachable from config, so each row below is the full controller with exactly one term disabled:
#
#   steer_brake_coeff = 0        -> step 2 off (forward authority not compensated for the turn)
#   angular_droop_coeff = 0      -> step 3's droop term off (yaw authority not compensated)
#   max_linear_speed_rev = k_fwd -> step 5 off (the reverse-gain rescale becomes a no-op)
#
# Run on the turning approach, where all three terms bite. `full` is the reference row.

sim_config = "simulation/sim_mrs_buff_mk3.toml"

[[runs]]
name = "turn90_full"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0

[[runs]]
name = "turn90_no_steer_brake"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
"navigation.steer_brake_coeff" = 0.0

[[runs]]
name = "turn90_no_droop"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
"navigation.angular_droop_coeff" = 0.0

[[runs]]
name = "turn90_no_rev_gain"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
"navigation.max_linear_speed_rev" = 4.88002

[[runs]]
name = "stop_full"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0

[[runs]]
name = "stop_no_rev_gain"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
"navigation.max_linear_speed_rev" = 4.88002

[[runs]]
name = "stop_no_steer_brake"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
"navigation.steer_brake_coeff" = 0.0
