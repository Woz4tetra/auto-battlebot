# Stage 3 scenario 3: ram (nonzero terminal velocity). Same controller, different terminal condition.
# The tracker commands attack_terminal_velocity = 0.615 of its 4.88 m/s top speed, so its
# distance-to-go profile arrives at the goal at ~3 m/s and drives through, a controlled contact
# speed. The baseline PursuitNavigation has no terminal-velocity concept: with brake_distance = 0
# it rams at whatever the velocity ramp gives (uncontrolled, near top speed).
#
# Compare in results.csv: impact_speed_mps (should be ~3.0 for the tracker, ~commanded contact
# speed), min_dist_m, reached, wall_contacts.
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/stage3_ram.toml --out playground/control_stage0/sweep_out/stage3_ram

sim_config = "simulation/sim_mr_stabs_mk2.toml"

# --- ram_center: -0.9,-0.9 -> 0,0 ---
[[runs]]
name = "center_baseline"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.05
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.0

[[runs]]
name = "center_tracker"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.attack_terminal_velocity" = 0.615  # 3.0 m/s
"navigation.max_angular_command" = 0.25

# --- ram_short: -0.5,-0.5 -> 0,0 (less runway to reach contact speed) ---
[[runs]]
name = "short_baseline"
[runs.sim]
"our_robot.start_pos" = [-0.5, -0.5]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.05
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.0

[[runs]]
name = "short_tracker"
[runs.sim]
"our_robot.start_pos" = [-0.5, -0.5]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.attack_terminal_velocity" = 0.615  # 3.0 m/s
"navigation.max_angular_command" = 0.25

# --- terminal-velocity characterization: does the contact speed track the command? ---
# Longest runway the 2.4 m arena allows (corner -> center, ~1.41 m). impact_speed_mps should rise
# monotonically with the commanded attack_terminal_velocity.
[[runs]]
name = "vt_char_0p0"
[runs.sim]
"our_robot.start_pos" = [-1.0, -1.0]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.attack_terminal_velocity" = 0.0
"navigation.stop_distance" = 0.0
"navigation.max_angular_command" = 0.25

[[runs]]
name = "vt_char_1p5"
[runs.sim]
"our_robot.start_pos" = [-1.0, -1.0]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.attack_terminal_velocity" = 0.307  # 1.5 m/s
"navigation.max_angular_command" = 0.25

[[runs]]
name = "vt_char_3p0"
[runs.sim]
"our_robot.start_pos" = [-1.0, -1.0]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.attack_terminal_velocity" = 0.615  # 3.0 m/s
"navigation.max_angular_command" = 0.25

[[runs]]
