extends = "_jetson"

[robot_filter.label_mapping]
"MRS_BUFF_MK3" = ["THEIR_ROBOT_1"]
"MR_STABS_MK2" = ["OUR_ROBOT_1"]

[robot_mask_model]
their_robot_labels = ["OPPONENT", "MRS_BUFF_MK3"]

# Mr Stabs Mk2 has no jig plant fit, so it stays on the pre-Stage-4 pursuit controller. `type`
# differs from _common, so the merge replaces that section wholesale: every field this controller
# needs has to be listed here, not inherited.
[navigation]
type = "PursuitNavigation"
angular_kp = 0.1
angular_kd = 0.003
max_linear_command = 0.65         # 0 = no limit
angle_threshold = 1.7
velocity_ramp_far_distance = 1.5
velocity_ramp_near_distance = 1.0
velocity_ramp_min_scale = 0.35
wall_reverse_distance = 0.25      # set > 0 to reverse when within this distance of any wall
wall_heading_threshold = 1.047    # ~60 deg; heading must point toward wall to trigger reversal
max_angular_command = 0.0         # 0 = no limit

[transmitter]
# The radio model mixes linear/angular into the motor outputs, so send body axes.
drive_processor = "DifferentialDriveProcessor"
wheel_track_width = 0.131
max_motor_rpm = 1500                           # RPM
max_motor_rpm_per_sec = 2000                   # RPM/s; caps linear accel at 8.5 m/s^2, 3247 RPM/s (slip/flip limit). 0 = off
lifted_deadzone_percent = 0
zero_deadzone_percent = 2
reverse_angular_channel = true
velocity_saturation_limit = 1.0                # 0 = disabled; e.g. 1.0 = |linear| + |angular| <= 1

[robot_filter.motion_estimator]
type = "DeadReckoningMotionEstimator"
