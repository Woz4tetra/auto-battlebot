; ESP-NOW dongle: USB serial from the Jetson in, ESP-NOW to mr_stabs_mk2 out.
; See docs/plans/espnow_link_plan.md.

[platformio]
default_envs = qtpy_nopsram

[common]
; Pinned like mr_stabs_mk2: the global pioarduino 55.x (IDF 5) otherwise wins over an unpinned
; espressif32, and the wire format assumes IDF 4.4's 250-byte ESP-NOW frames.
platform = espressif32@6.13.0
framework = arduino
lib_extra_dirs = ../shared
build_flags =
    -Wall
    -Wextra
    ; Hardware USB-Serial/JTAG CDC: enumerates as 303a:1001 with the MAC as its USB serial number,
    ; which the udev rule keys on, and needs no TinyUSB stack.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 921600

; Development dongle: Adafruit QT Py ESP32-S3, 8 MB flash, no PSRAM. The match dongle will be an
; ESP32-S3 with a u.FL antenna; add an env with its board and nothing else changes.
[env:qtpy_nopsram]
platform = ${common.platform}
framework = ${common.framework}
board = adafruit_qtpy_esp32s3_nopsram
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}
; The board file assumes TinyUSB: a 1200 bps touch to enter the bootloader, then a wait for the
; port to come back. On the USB-Serial/JTAG port esptool's usb_reset does it directly, with no
; BOOT press.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.before_reset = usb_reset
