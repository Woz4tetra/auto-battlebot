# x86_64 SVO replay profile for desktop development and regression testing. Identical to main.toml
# except for the x86 engines, the SVO source, the playback transmitter, and dev UI/mcap/health
# toggles, so it extends main and declares only those deltas.
extends = "main"

[rgbd_camera]
camera_fps = 60

# svo_file_path = "data/svo/tests/2026-04-20T18-02-50.svo2"
# svo_file_path = "data/svo/tests/2026-04-19T17-01-18.svo2"
# svo_file_path = "data/svo/tests/2026-04-26T20-21-45.svo2"
svo_file_path = "data/svo/tests/2026-04-26T20-22-08.svo2"

# svo_file_path = "data/svo/tests/2026-05-01T09-35-26.svo2"
# svo_file_path = "data/svo/tests/2026-05-01T09-40-36.svo2"
# svo_file_path = "data/svo/tests/2026-05-01T09-47-40.svo2"
# svo_file_path = "data/svo/tests/2026-05-01T11-22-34.svo2"  # field finding
# svo_file_path = "data/svo/tests/2026-05-01T11-27-37.svo2"  # auto driving with eric
# svo_file_path = "data/svo/tests/2026-05-01T14-17-26.svo2"  # 1080p foil safety cage
# svo_file_path = "data/svo/tests/2026-05-01T17-42-24.svo2"

# NHRL May 02 2026
# svo_file_path = "data/svo/2026-05-02T10-06-06.svo2"
# svo_start_frame = 8000

# svo_file_path = "data/svo/2026-05-02T11-45-08.svo2"
# svo_start_frame = 13000

# svo_file_path = "data/svo/1729981242.4295187.svo2"

# svo_file_path = "data/svo/2026-03-27T21-48-29.svo2"
# svo_start_frame = 4100

# svo_file_path = "data/svo/mini_bot_2024-10-26T13-29-41.svo2"
# position_tracking = false
svo_real_time_mode = true

# Same DeepLabMaskModel as main, x86 engine.
[field_model]
model_path = "data/models/field_deeplabv3p_r50_2026-04-29_x86_64_sm89.engine"

# Same YoloSeg type + label config inherited from main, x86 engine.
[robot_mask_model]
model_path = "data/models/yolo26n-seg_nhrl_robots_2026-04-27_x86_64_sm89.engine"

[keypoint_model]
model_path = "data/models/yolo26n-pose_our_robots_2026-05-01_x86_64_sm89.engine"

# Type change -> replaces main's OpenTxTransmitter wholesale.
[transmitter]
type = "PlaybackTransmitter"
init_delay_seconds = 0.4
lifted_deadzone_percent = 10
zero_deadzone_percent = 2

[ui]
enable = true
fullscreen = false
battery_source = "None"

[mcap]
enable = false
ignored_topics = []

[health]
tegrastats_enable = false # merges over main's [health]; enable/x86_tools/sample_period inherited
