
[[cages]]
name = "nhrl_cage"
enabled = true
probability = 0.5
spec = "cage/cage2_overhead_high.toml"
camera_calibration = "../../config/cameras/synthetic_cage_lens_118deg.toml"
view = "pinhole"
rectify_alpha = 1.0
render_samples = 64
tube_jitter = 0.25
mat_margin_m = 0.20
randomize_house_bot = true
house_bot_clearance_m = 0.05

[cages.mount]
