# Crossing-heading sweep: opponent drives straight (bouncing off walls) on different headings at
# 60 ms latency. Shows the lead/lag error of chasing a linearly-moving target with no prediction.
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/crossing_headings.toml --out playground/control_stage0/sweep_out/crossing_headings

[[runs]]
name = "head000"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "straight", start_pos = [-0.9, 0.0], heading_deg = 0.0, speed = 1.2 }]

[[runs]]
name = "head090"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "straight", start_pos = [0.0, -0.9], heading_deg = 90.0, speed = 1.2 }]

[[runs]]
name = "head135"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "straight", start_pos = [0.9, -0.9], heading_deg = 135.0, speed = 1.2 }]

[[runs]]
name = "head225"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "straight", start_pos = [0.9, 0.9], heading_deg = 225.0, speed = 1.2 }]
