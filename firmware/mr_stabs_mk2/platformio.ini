; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = local

[common]
; Pin to the official espressif32 platform (Arduino core 2.x / IDF 4.4).
; The pioarduino fork (55.x, IDF 5) drops NeoPixel's rmt_reserved_channels
; and deprecates the legacy RMT driver DShot.cpp uses.
platform = espressif32@6.13.0
board = adafruit_qtpy_esp32s3_n4r2
; Adds a core dump partition; see the header of partitions.csv. Envs copy it by name below.
; OTA uploads do not rewrite the partition table: flash over USB once to apply it.
board_build.partitions = partitions.csv
framework = arduino
; Serial on the chip's USB-Serial/JTAG port instead of TinyUSB. That port is hardware: it stays up
; when the firmware hangs, and esptool can reset the chip into the ROM bootloader through it, so a
; bad image is rescued over USB without pressing BOOT (glued on this robot).
; AsyncTCP's task defaults to any core, so serving the web page or /telemetry could preempt the
; control loop on core 1. Pinned to core 0 with WiFi.
build_flags = -DARDUINO_USB_MODE=1 -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
; The ESP-NOW wire format, shared with firmware/espnow_dongle and the Jetson app.
lib_extra_dirs = ../shared
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit NeoPixel
    https://github.com/AlfredoSystems/AlfredoCRSF.git
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    ; Tuning mode's one-wire bootloader link, the version the standalone passthrough runs.
    plerup/EspSoftwareSerial@8.2.0
; Gzips web/ (the diagnostics page) into a header at build time.
extra_scripts = pre:scripts/embed_web.py

[env:local]
platform = ${common.platform}
board = ${common.board}
board_build.partitions = ${common.board_build.partitions}
framework = ${common.framework}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
; The board file assumes TinyUSB: a 1200 bps touch to enter the bootloader, then a wait for the
; port to come back. With the USB-Serial/JTAG port esptool's usb_reset does it directly, so no
; BOOT press, even with the firmware hung.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.before_reset = usb_reset

[env:ota]
platform = ${common.platform}
board = ${common.board}
board_build.partitions = ${common.board_build.partitions}
upload_protocol = espota
framework = ${common.framework}
lib_extra_dirs = ${common.lib_extra_dirs}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}

; Host-side unit tests: ./scripts/test. Builds lib/ code with the host gcc, no Arduino core.
[env:native]
platform = native
test_framework = googletest
lib_extra_dirs = ../shared
build_flags = -std=gnu++17 -Wall -Wextra -Werror
