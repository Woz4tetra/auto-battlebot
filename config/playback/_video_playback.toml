extends = "_desktop"

[rgbd_camera]
type = "VideoPlaybackCamera"
start_frame = 0
real_time_mode = true
calibration_file = ""

[field_filter]
type = "FiducialFieldFilter"

[keypoint_filter.height]
reject_enable = false

[keypoint_filter.static]
enable = true

[clock]
type = "CameraFollowingClock"

[transmitter]
from = "transmitters/playback"

[mcap]
enable = false
