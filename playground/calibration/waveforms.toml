# Excitation waveforms for velocity jig runs.
#
#   python playground/calibration/velocity_jig_drive.py --waveform lin_step_full --name ...
#
# Every entry declares kind + channel + role. Those are also what the fit routes on, so a
# new waveform reaches the right fit without editing fit_jig_plant.py.
#
#   kind     step | staircase | coast | grid | prbs | chirp | sine | triangle | trim | manual
#   channel  linear | angular | combined
#   role     fit (trains the model) | holdout (validates it, never fitted)
#
# Amplitudes are normalized to [-1, 1]. Deadzone is NOT compensated anywhere: the physical
# deadzone is one of the things being measured.
#
# `reverse_cap` on a step or coast waveform scales the reverse half of the ladder to that
# peak, leaving forward alone. Use it when the robot misbehaves in one direction only. Keep
# it per waveform: [defaults] merges into every entry, and on an angular waveform it would
# shrink right turns against left ones and bias k_ang.

[defaults]
# 0.6 s is set by floor length, not by the runbook's 2 s. At the fitted tau_lin_a of
# 0.1309 s it is 4.6 time constants, 98.98% settled, and a full-command step costs 1.88 m
# including the coast to a stop. Two seconds would be 15 tau and 6.57 m, more floor than
# this robot has and more settling than a first-order rise can use.
#
# The runbook's 2 s predates the measured tau. What it was guarding against was stage 2's
# 0.2 s, which is 1.5 tau and only 78% settled, so there was genuinely no plateau to read.
# Precision on k_fwd and k_rev comes from segment count, not segment length: k_rev is
# +/- 38% from n=4, and reps fix that where a longer hold does not.
#
# Angular waveforms override this below. A spin costs no floor, so there is no reason to
# be stingy there.
hold_s = 2.0
# Coasting happens after the robot has stopped travelling under command, so a long tail
# costs 0.30 m regardless. 2.0 s is 22 decel constants.
coast_s = 3.0

# Cap for angular amplitudes. The encoder wheel scrubs sideways through every spin, so the
# rate limit measured on the bench caps every angular run. Set from your own E5 measurement:
# encoder_rate_limit / k_ang.
#
# The old 0.13 was 8.0 / 61.5, using stage 2's camera k_ang. The jig measures k_ang at
# 32.16 +/- 0.572 rad/s, and the raw gyro counts rule out 61.5 outright: LOG-69 peaked at
# 2054 dps against a 2294 dps full scale, where 61.5 rad/s would be 3524 dps and would have
# railed. So the cap doubles to 8.0 / 32.16 = 0.249.
#
# This assumes rate_limit = 8.0 rad/s in jig_calibration.toml is a real E5 measurement. E5
# has not been run: r_enc_perp and r_imu are both still 0.0. Run it before trusting this,
# and stop the moment the encoder wheel chatters or leaves a scrub mark.
angular_cap = 0.24

# --- linear ---------------------------------------------------------------

[waveform.lin_deadzone]
kind = "staircase"
channel = "linear"
role = "fit"
label = "linear deadzone staircase"
# Starts at 0.001, not 0.01. Same mistake one decade down: the 2026-08-20 fit put the
# forward crossing between 0.000 and 0.010, meaning the robot already moved on the first
# rung and the crossing is again an extrapolation. Resolution is the step size, so 0.01
# steps can only ever report +/- 0.0098.
#
# Stops at 0.030 rather than 0.10. The crossing is under 0.01, so rungs above 0.03 measure
# nothing the step runs do not already cover, and 30 rungs at 2 s each is already 60 s per
# direction.
from = 0.001
to = 0.030
step = 0.001
both_directions = true
# Rungs run back to back with no return to zero, so distance accumulates across all 30.
# At 1.0 s that is 0.82 m per direction and 7.6 tau per rung, both comfortable.
hold_s = 0.5

[waveform.lin_step_full]
kind = "step"
channel = "linear"
role = "fit"
label = "linear steps"
amplitudes = [1.0, 0.75, 0.5, 0.25]
shuttle = true
# Reverse ladder scaled to a 0.4 peak, so [0.1, 0.2, 0.3, 0.4]. At and above 0.5 reverse the
# robot breaks into an uncommanded spin, and a spun hold is not a straight-line steady state:
# the encoder wheel scrubs sideways, so the arc length it reports is not the distance
# travelled, and the r_enc_perp lever-arm correction assumes rolling and cannot recover it.
#
# Nothing downstream would have caught this. `held_segments` gates on the commanded angular
# channel, which is zero through a linear run, so spun rungs feed `k_rev`, the pooled
# `tau_lin_a`, and both drift terms as clean data.
#
# 0.4 rather than 0.45 leaves margin: the spin threshold is where it was observed, not where
# it was measured, and it will move with floor and pack voltage. Raise this once the
# underlying asymmetry is fixed, since the reverse gain is measured over a shorter lever arm
# until then.
reverse_cap = 0.4
# Not trimmed. This is the run the straight-line drift is measured from, so correcting the
# arc here would remove the signal.
trim = false
hold_s = 2.0

[waveform.lin_coast]
kind = "coast"
channel = "linear"
role = "fit"
label = "linear coast tails"
amplitude = 0.5
# Reverse entries drop to 0.4, same spin threshold as lin_step_full. The decel constant is
# read off the tail, and a tail that starts from a spin decays with the scrub in it.
reverse_cap = 0.4
reps = 10
shuttle = true
trim = false

# --- angular --------------------------------------------------------------

[waveform.ang_deadzone]
kind = "staircase"
channel = "angular"
role = "fit"
label = "angular deadzone staircase"
# Left crossed between 0.000 and 0.010 on 2026-08-20, same as the linear channel. Right
# crossed between 0.010 and 0.019, so it needs the range and the resolution.
from = 0.001
to = 0.030
step = 0.001
both_directions = true
# Pivoting in place, so the 2 s the runbook asks for is free here.
hold_s = 2.0

[waveform.ang_step_full]
kind = "step"
channel = "angular"
role = "fit"
label = "angular steps"
amplitudes = [0.25, 0.5, 0.75, 1.0]
cap = 1.0
hold_s = 3.0
coast_s = 3.0
shuttle = true

[waveform.ang_coast]
kind = "coast"
channel = "angular"
role = "fit"
label = "angular coast tails"
# The angular decel constant had no dedicated excitation before, so it was fitted from the
# drops at the end of angular steps alone. This is the run to add when it comes back weak.
amplitude = 1.0
reps = 10
shuttle = true
hold_s = 3.0

# --- coupling -------------------------------------------------------------

[waveform.coupling_grid]
kind = "grid"
channel = "combined"
role = "fit"
label = "coupling grid"
# Tops out at 0.76, not 1.0, so no cell asks for more authority than the mix can deliver.
# to_channels gives angular priority and clips linear to 1 - abs(ang), so a 1.0 cell at the
# 0.24 cap goes out as 0.76. That is a 0.24 gap between commanded and measured, which trips
# the contamination gate at 0.05 and discarded LOG-71 as a leaning stick when the sticks
# were centered: every cell over the bar had tgt_lin = 1.0, and the median error across all
# 56 held stretches was 0.0029, same as the clean runs.
linear = [0.25, 0.5, 0.7, 0.76]
# Spans BOTH signs, and that is load-bearing. Steer-brake and angular droop flip with the
# turn direction; straight-line drift does not. A grid that only ever turns one way cannot
# separate them and will quietly fold the drift into the droop coefficient.
angular = [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
hold_s = 1.5

# --- holdouts -------------------------------------------------------------
# These are used for testing the model not for fitting.

[waveform.lin_prbs]
kind = "prbs"
channel = "linear"
role = "holdout"
label = "linear PRBS"
# 0.4, not 0.6. A PRBS is symmetric by construction, so a 0.6 amplitude commands -0.6 on
# every reverse bit, which is past the amplitude where this robot breaks into an uncommanded
# spin. LOG-76, LOG-77 and LOG-88 were all recorded that way, so the whole linear holdout set
# validated the model against a scrubbing encoder wheel. A holdout that fails for that reason
# looks exactly like a model error and costs an afternoon.
#
# Capping only the reverse half is not an option here the way it is for steps and coasts:
# an asymmetric PRBS has different spectral content and a DC bias that walks the robot down
# the floor over 30 s. Lowering both halves keeps the sequence a PRBS.
#
# The cost is excitation amplitude, so the prediction error is measured against a smaller
# signal. That is the right trade against validating on data the plant model does not
# describe. Raise it once the reverse asymmetry itself is fixed.
amplitude = 0.4
# 60 ms bits cover roughly 0.2 to 8 Hz, which brackets both the 58-78 ms plant time
# constants and the 33 ms frame period. Unchanged: bit rate sets the bandwidth, and only
# the amplitude moved.
bit_ms = 60
duration_s = 30
seed = 44001

[waveform.ang_prbs]
kind = "prbs"
channel = "angular"
role = "holdout"
label = "angular PRBS"
amplitude = 0.5
bit_ms = 60
duration_s = 30
seed = 44002

[waveform.combined_prbs]
kind = "prbs"
channel = "combined"
role = "holdout"
label = "combined PRBS"
amplitude = 0.3
angular_amplitude = 0.5
bit_ms = 60
duration_s = 30
seed = 44003

[waveform.lin_chirp]
kind = "chirp"
channel = "linear"
role = "holdout"
label = "linear chirp"
# A first-order model with tau 58 ms puts its corner near 2.7 Hz. This sweep is the
# frequency-domain cross-check on a time constant fitted from steps.
f0_hz = 0.2
f1_hz = 8.0
amplitude = 0.4
duration_s = 30

[waveform.ang_chirp]
kind = "chirp"
channel = "angular"
role = "holdout"
label = "angular chirp"
f0_hz = 0.2
f1_hz = 8.0
amplitude = 0.5
duration_s = 30

[waveform.lin_sine]
kind = "sine"
channel = "linear"
role = "holdout"
label = "linear sine"
freq_hz = 1.0
# 0.4 for the same reason as lin_prbs: a sine is symmetric, so 0.5 drove the reverse half
# into the spin. LOG-88 was recorded at 0.5.
amplitude = 0.4
cycles = 10

[waveform.lin_triangle]
kind = "triangle"
channel = "linear"
role = "holdout"
label = "linear triangle"
freq_hz = 1.0
amplitude = 0.4
cycles = 12

[waveform.operator]
kind = "manual"
channel = "combined"
role = "holdout"
label = "operator driving"
# Emits nothing. The operator drives and the radio's own mixer output is the command log,
# which is why the readback exists.
duration_s = 60

# --- bench ----------------------------------------------------------------

[waveform.trim]
kind = "trim"
channel = "linear"
role = "holdout"
label = "straight-line trim"
# Low and slow, to measure how far the robot arcs before committing to a long straight run.
amplitude = 0.15
duration_s = 5
