name: verify
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: true
      args:
        type: string
        required: true
      jetson-data:
        type: boolean
        default: false
jobs:
  verify:
    name: verify ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git -c init.defaultBranch=main init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "$SERVER/$REPO.git" "$SHA"
          git checkout -q --detach FETCH_HEAD
      - name: link data
        run: ci/link_data.sh
      - name: check clips
        if: ${{ inputs.jetson-data }}
        run: venv/bin/python -m auto_battlebot.verify.ci_clips check
      - name: build engines
        if: ${{ inputs.jetson-data }}
        run: ci/build_engines.sh
      - name: verify ${{ inputs.args }}
        run: scripts/verify ${{ inputs.args }}
