# Stage 4 scenario: approach a goal that starts well off the bearing, baseline
# (PursuitNavigation) vs tracker (MotionProfileNavigation).
#
# The stage3 sweeps all start roughly pointed at their goal, so they barely exercise the turn.
# That leaves the steer-brake coupling (c_sb = 2.702) untested: the plant kills forward authority
# in proportion to |angular command|, and between the angular cap and the drive gate the tracker
# commands forward motion the plant does not deliver. These runs start the robot 45, 90 and 135
# degrees off the goal bearing so the approach has to turn and drive at once.
#
# Compare in results.csv: terminal_pos_err_m, overshoot_m, t_to_goal_s, mean_abs_ang_deg.
# Run: playground/control_stage0/run_stage4_sweeps.sh <tag> stage4_turn

sim_config = "simulation/sim_mrs_buff_mk3.toml"

# --- turn45: start heading 45 deg off the goal bearing ---
[[runs]]
name = "turn45_baseline"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 90.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.8

[[runs]]
name = "turn45_tracker"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 90.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0

# --- turn90: start perpendicular to the goal bearing ---
[[runs]]
name = "turn90_baseline"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.8

[[runs]]
name = "turn90_tracker"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0

# --- turn135: start most of the way around; exercises the hysteresis latch too ---
[[runs]]
name = "turn135_baseline"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 180.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.stop_distance" = 0.15
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.8

[[runs]]
name = "turn135_tracker"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 180.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0

# --- arc: goal off to the side at close range, so the whole approach is a turn ---
[[runs]]
name = "arc_baseline"
[runs.sim]
"our_robot.start_pos" = [0.0, -0.9]
"our_robot.start_yaw_deg" = 90.0
opponents = [{ behavior = "static", start_pos = [0.7, -0.2] }]
[runs.cpp]
"navigation.stop_distance" = 0.15
"navigation.max_angular_command" = 0.25
"navigation.brake_distance" = 0.8

[[runs]]
name = "arc_tracker"
[runs.sim]
"our_robot.start_pos" = [0.0, -0.9]
"our_robot.start_yaw_deg" = 90.0
opponents = [{ behavior = "static", start_pos = [0.7, -0.2] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.terminal_velocity" = 0.0
