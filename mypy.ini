# mypy configuration, mirroring Pickle-Robot conventions.
# Strict-by-default: untyped defs are errors, unused ignores/casts warn, and
# unreachable code is flagged. Third-party libraries without type stubs are
# silenced per-module below. The playground/ directory is intentionally excluded.
[mypy]
python_version = 3.10
files = simulation, scripts, logo
exclude = (^|/)(\.?venv|build|build-test|dist|__pycache__|playground|data)/
# Resolve the synthgen package (training/synthetic/synthgen) under its runtime
# module name; the entry scripts put training/synthetic on sys.path. logo/ is
# on the path so its sibling-script imports (gen_splash_animation) resolve.
# simulation/ is on the path so its internal packages (config, sim_types) and
# sibling modules (scene, runner, behaviors, protocol, camera_utils) resolve
# under the same top-level names the entry scripts import them by at runtime.
mypy_path = training/synthetic, logo, simulation
warn_unused_configs = True
warn_return_any = True
follow_imports = normal
namespace_packages = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
check_untyped_defs = True
allow_untyped_defs = False
explicit_package_bases = True
local_partial_types = True

[mypy-genesis.*]
ignore_missing_imports = True

[mypy-dacite.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-mcap.*]
ignore_missing_imports = True

[mypy-mcap_ros1.*]
ignore_missing_imports = True

[mypy-tensorrt.*]
ignore_missing_imports = True

[mypy-pycuda.*]
ignore_missing_imports = True

# Sibling-script import (training/model_eval/compare_cpp_python.py imports score.py);
# resolvable at runtime via the script dir, not as an installed module.
[mypy-score]
ignore_missing_imports = True

# NHRL distractor pipeline sibling-script imports (training/synthetic/*.py),
# resolvable at runtime via the script dir, not as installed modules.
[mypy-nhrl_common]
ignore_missing_imports = True

[mypy-nhrl_audit]
ignore_missing_imports = True

# tomllib is stdlib from 3.11; the Blender-side scripts run on 3.11 while this
# config checks as 3.10, so its absence from 3.10 typeshed must be ignored.
[mypy-tomllib]
ignore_missing_imports = True

# tomli is the <3.11 backport imported as the tomllib fallback; no stubs needed.
[mypy-tomli]
ignore_missing_imports = True

# tqdm ships no type stubs; progress bars are untyped at the call sites anyway.
[mypy-tqdm]
ignore_missing_imports = True

# Blender-side modules: only importable inside Blender's bundled Python under
# `blenderproc run`, never in the dev venv.
[mypy-bpy.*]
ignore_missing_imports = True

[mypy-bpy_extras.*]
ignore_missing_imports = True

[mypy-blenderproc.*]
ignore_missing_imports = True

[mypy-mathutils.*]
ignore_missing_imports = True

# scikit-learn ships no type stubs; used only in offline analysis scripts.
[mypy-sklearn.*]
ignore_missing_imports = True

# Sibling-module import in training/yolo (scripts run from that directory).
[mypy-seg_to_bbox]
ignore_missing_imports = True
