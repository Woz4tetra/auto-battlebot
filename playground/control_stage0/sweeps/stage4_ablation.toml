# Stage 4 ablation: turn each compensation off one at a time, on the scenario that exercises it.
#
# The plan asks for a delta per step rather than one combined number. Steps 2, 3 and 5 are all
# reachable from config, so each row below is the full controller with exactly one term disabled:
#
#   plant.c_sb = 0        -> step 2 off (forward authority not compensated for the turn)
#   plant.k_rev = k_fwd   -> step 5 off (the reverse-gain rescale becomes a no-op)
#
# Those two edit the shared [plant] table, which is where the controller now reads the fit from.
# That only ablates the controller here: the sim profile runs GroundTruthRobotFilter, so no
# motion estimator reads the same table back.
#
# Droop runs the other way. `compensate_angular_droop` ships false because compensating for the
# measured c_ad made the controller worse, so its row turns the term ON to price that decision.
#
# Run on the turning approach, where all three terms bite. `full` is the reference row, and it is
# also the shipped configuration.

sim_config = "simulation/sim_mrs_buff_mk3.toml"

[[runs]]
name = "turn90_full"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0

[[runs]]
name = "turn90_no_steer_brake"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0
"plant.c_sb" = 0.0

[[runs]]
name = "turn90_with_droop"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0
"navigation.compensate_angular_droop" = true

[[runs]]
name = "turn90_no_rev_gain"
[runs.sim]
"our_robot.start_pos" = [-0.8, -0.8]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0
"plant.k_rev" = 4.88002

[[runs]]
name = "stop_full"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0

[[runs]]
name = "stop_no_rev_gain"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0
"plant.k_rev" = 4.88002

[[runs]]
name = "stop_no_steer_brake"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
opponents = [{ behavior = "static", start_pos = [0.0, 0.0] }]
[runs.cpp]
"navigation.type" = "MotionProfileNavigation"
"navigation.stop_distance" = 0.15
"navigation.attack_terminal_velocity" = 0.0
"plant.c_sb" = 0.0
