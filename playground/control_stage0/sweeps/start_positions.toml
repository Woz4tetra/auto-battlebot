# Start-position sweep: static opponent at (0.5,0.5), 60 ms latency, vary where we start.
# Shows how approach geometry changes the overshoot (corner approaches vs head-on).
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/start_positions.toml --out playground/control_stage0/sweep_out/start_positions

[[runs]]
name = "sw_corner"
[runs.sim]
"latency.command_ms" = 60.0
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.5, 0.5] }]

[[runs]]
name = "nw_corner"
[runs.sim]
"latency.command_ms" = 60.0
"our_robot.start_pos" = [-0.9, 0.9]
"our_robot.start_yaw_deg" = -45.0
opponents = [{ behavior = "static", start_pos = [0.5, 0.5] }]

[[runs]]
name = "se_corner"
[runs.sim]
"latency.command_ms" = 60.0
"our_robot.start_pos" = [0.9, -0.9]
"our_robot.start_yaw_deg" = 135.0
opponents = [{ behavior = "static", start_pos = [0.5, 0.5] }]

[[runs]]
name = "west_edge"
[runs.sim]
"latency.command_ms" = 60.0
"our_robot.start_pos" = [-0.9, 0.5]
"our_robot.start_yaw_deg" = 0.0
opponents = [{ behavior = "static", start_pos = [0.5, 0.5] }]

[[runs]]
name = "near_behind"
[runs.sim]
"latency.command_ms" = 60.0
"our_robot.start_pos" = [0.5, -0.4]
"our_robot.start_yaw_deg" = 90.0
opponents = [{ behavior = "static", start_pos = [0.5, 0.5] }]
