[project]
name = "auto-battlebot"
version = "0.1.0"
description = "Auto Battlebot Project"
requires-python = ">=3.10"
dependencies = [
  "ultralytics",
  "numpy>=1.26.0,<2.0.0; platform_machine == \"aarch64\"",
  "numpy>=2.0.0,<3.0.0; platform_machine != \"aarch64\"",
  "smbus2; platform_machine == \"aarch64\"",
  "matplotlib",
  "scipy",
  "minigencpp @ git+https://github.com/Woz4tetra/minigencpp.git",
  "tqdm>=4.60.0",
  "types-tqdm",
  "tomli; python_version < '3.11'",
  "tomli_w",
  "dacite",
  "ruff",
  "mypy",
  "pytest",                                                       # training/synthetic/tests (synthgen pure modules)
  "livelossplot",
  "ipython",
  "torchmetrics",
  "pycocotools",                                                  # torchmetrics MeanAveragePrecision backend (training/model_eval)
  "segmentation-models-pytorch",
  "opencv-python>=4.5.0",
  "pyyaml>=6.0",
  "pandas",
  "onnxscript",
  "natsort",
  "gdown",
  "mcap",
  "trimesh",
  "shapely",
  "pyserial",                                                     # playground/calibration: drives the OpenTX trainer link for drivetrain characterization
  "Pillow",                                                       # playground/calibration: print-accurate AprilTag PDF export (make_print_tags.py)
  "rembg==2.0.83",                                                # training/model_eval: floor saliency experiment (rembg_field_*.py)
  # x86 only: often unavailable or different on Jetson (aarch64)
  "pycuda; platform_machine == \"x86_64\"",
  "torch>=2.0.0; platform_machine == \"x86_64\"",
  "tensorrt==10.14.1.48.post1; platform_machine == \"x86_64\"",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_battlebot*", "playground*"]
# playground/calibration/venv is a populated DepthAI venv (depthai 2.32 with its own cv2),
# gitignored but present on disk. Without this every package under its site-packages is
# discovered as playground.calibration.venv.lib...
exclude = ["playground.calibration.venv*"]

# --- tooling (style + typing rules; mirrors Pickle-Robot conventions) ---------
# playground/ is linted and formatted like the rest of the tree but stays out of mypy:
# it holds analysis scripts, not shipped code, and is not held to the typing bar.
# Anything in there that two callers share belongs in auto_battlebot/ instead.

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true
exclude = [
  ".git",
  "*venv*",
  "__pycache__",
  "build",
  "build-test",
  "dist",
  "data",
]
lint.select = ["C9", "E", "F", "N", "Q", "W", "I", "INP"]
lint.ignore = [
  "E402", # module level import not at top of file
  "Q003", # avoidable-escaped-quote
]
lint.unfixable = [
  "F401", # unused imports
  "F841", # unused variables
]

[tool.ruff.lint.per-file-ignores]
# Top-level scripts are run directly, not imported as a package.
"scripts/*" = ["INP"]
"simulation/*.py" = ["INP"]
"training/**/*.py" = ["INP"]
# Analysis scripts: one long linear main() per file, reading a recording and writing
# plots. Splitting them to satisfy the complexity limit costs more than it buys. The
# library code they call does not get this exemption; it lives in auto_battlebot/.
"playground/**/*.py" = ["C901"]

[tool.ruff.lint.flake8-quotes]
multiline-quotes = "double"
avoid-escape = false
inline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
