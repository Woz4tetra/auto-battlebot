# Mr Stabs Mk2 on RlPolicyNavigation against the sim, with simulated perception. Pairs with
# simulation/sim_mr_stabs_mk2.toml, which matches the world the policy trained in:
#
#   ./scripts/run_simulation.sh simulation/sim_mr_stabs_mk2.toml \
#       config/simulation/mr_stabs_mk2_rl_sim.toml
#
# Swap the bundle for any export under data/models/nav_policies/ (playground/rl/export_checkpoint.py).
extends = "simulation/mr_stabs_mk2_kinematic_sim_sensing"

# `type` differs from the base's PursuitNavigation, so this replaces the section wholesale.
[navigation]
type = "RlPolicyNavigation"

[navigation.policy]
bundle = "data/models/nav_policies/rl_nav_d_v2_8k"
