# Candidate-model evaluation profile for detector comparison. Extends playback with MCAP
# recording on (images excluded: the GT dataset already has them), UI off, SVO replayed as
# fast as possible. Swap [robot_mask_model] model_path and label config per candidate, run
# the same SVO as the GT labeling run, then score with training/model_eval/score.py.
extends = "playback/_playback"

[rgbd_camera]
svo_real_time_mode = false

[ui]
enable = false

[mcap]
enable = true
ignored_topics = ["/camera/image"]

# Per-candidate overrides go here, e.g.:
# [robot_mask_model]
# model_path = "data/models/<candidate>.engine"
# label_indices = ["OPPONENT", "OPPONENT", "HOUSE_BOT", "MR_STABS_MK2", "MRS_BUFF_MK3"]
