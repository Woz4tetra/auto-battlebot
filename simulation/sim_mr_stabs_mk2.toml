# Fast headless kinematic sim config for MR STABS MK2 (simulation/kinematic_sim_server.py).
# Plant calibrated by playground/calibration/fit_plant_calib.py, run 175805
# (docs/experiments/control_improvement/mr_stabs_mk2_calibration.md).
# Keep [arena] in sync with config/simulation/headless_sim.toml [field_filter].

[server]
host = "127.0.0.1"
port = 14882

[sim]
dt = 0.0333     # ~30 Hz sim time (matches the real controller rate)
seed = 0

[arena]
width = 2.4
height = 2.4

# Calibrated actuation latency (Crossfire + ESC + mechanical), in ms of sim time.
[latency]
command_ms = 60.0
observation_ms = 0.0

[camera]
res_width = 640
res_height = 360
# Overhead and slightly back, the way the ZED actually mounts over the cage. The old low side
# view was arbitrary: nothing rendered, so the pose only fed the projection-bias model. Now the UI
# draws its overlay on this frame, so the pose decides whether the arena is even in shot.
fov = 52.0
pos = [0.0, -0.5, 2.6]
lookat = [0.0, 0.0, 0.0]

[our_robot]
start_pos = [-0.9, -0.9]
start_yaw_deg = 45.0
sprite = "mr_stabs_mk2"
radius = 0.11
# Calibrated MR STABS MK2 plant (run 175805). Time constants are low confidence (one clean segment
# each) but physically sensible. max_linear_speed is the full-throttle value the robot achieves.
# NOTE: max_angular_speed may be inflated by yaw-keypoint flips in the calibration; revisit if turns
# look unrealistically fast in sim.
max_linear_speed = 5.6      # symmetric fallback (unused once _fwd/_rev are set)
max_angular_speed = 61.5
tau_linear = 0.058          # fallback
tau_angular = 0.066         # fallback
max_linear_speed_fwd = 5.6
max_linear_speed_rev = 4.84
tau_linear_accel = 0.058
tau_linear_decel = 0.078    # coast: the term that drives stopping overrun
tau_angular_accel = 0.066

[perception]
pos_noise_std = 0.0
yaw_noise_std = 0.0
dropout_prob = 0.0

[perception.projection_bias]
enabled = false
keypoint_height = 0.06

# For a "go to X and stop" mission this static opponent IS the goal point; the controller drives to it
# and (with navigation.stop_distance > 0 in the C++ overlay) stops on it.
[[opponents]]
behavior = "static"
start_pos = [0.0, 0.0]
speed = 1.0
heading_deg = 180.0
sprite = "mrs_buff_mk3"
radius = 0.5
replay_csv = ""
