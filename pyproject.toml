[project]
name = "auto-battlebot"
version = "0.1.0"
description = "Auto Battlebot Project"
requires-python = ">=3.10"
dependencies = [
  "ultralytics",
  "numpy>=1.26.0,<2.0.0; platform_machine == \"aarch64\" and python_version < \"3.11\"",
  "numpy>=2.0.0,<3.0.0; platform_machine != \"aarch64\" or python_version >= \"3.11\"",
  "smbus2; platform_machine == \"aarch64\"",
  "matplotlib",
  "scipy",
  "tqdm>=4.60.0",
  "types-tqdm",
  "tomli; python_version < '3.11'",
  "tomli_w",
  "dacite",
  "ruff",
  "mypy",
  "pytest",
  "livelossplot",
  "ipython",
  "torchmetrics",
  "pycocotools",
  "segmentation-models-pytorch",
  "opencv-python>=4.5.0",
  "av",
  "pyyaml>=6.0",
  "pandas",
  "onnxscript",
  "natsort",
  "gdown",
  "mcap",
  "foxglove-sdk",
  "mcap-protobuf-support",
  "trimesh",
  "shapely",
  "pyserial",
  "flask",
  "Pillow",
  "pycuda; platform_machine == \"x86_64\"",
  "torch>=2.0.0; platform_machine == \"x86_64\"",
  "tensorrt==10.14.1.48.post1; platform_machine == \"x86_64\"",
  "mujoco==3.14.0; platform_machine == \"x86_64\"",
  "mujoco-warp==3.14.0; platform_machine == \"x86_64\"",
  "warp-lang==1.17.0; platform_machine == \"x86_64\"",
  "cma==4.5.0; platform_machine == \"x86_64\"",
  "coacd==1.0.14; platform_machine == \"x86_64\"",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_battlebot*", "playground*"]
exclude = ["playground.calibration.venv*"]


[tool.ruff]
line-length = 100
target-version = "py310"
per-file-target-version = { "training/synthetic/**" = "py311" }
fix = true
exclude = [
  ".git",
  "*venv*",
  "__pycache__",
  "build",
  "build-test",
  "dist",
  "data",
]
lint.select = ["C9", "E", "F", "N", "Q", "W", "I", "INP", "TID251"]
lint.ignore = [
  "E402",
  "Q003",
]
lint.unfixable = [
  "F401",
  "F841",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["INP"]
"simulation/*.py" = ["INP"]
"training/**/*.py" = ["INP"]
"hardware/**/*.py" = ["INP"]
"auto_battlebot/compat.py" = ["TID251"]
"training/synthetic/**/*.py" = ["TID251"]
"playground/**/*.py" = ["C901"]

[tool.ruff.lint.isort]
sections = { blenderproc = ["blenderproc"] }
section-order = ["future", "blenderproc", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tomllib".msg = "Import tomllib from auto_battlebot.compat: it is stdlib only from Python 3.11, and the JetPack 6 venv is 3.10."

[tool.ruff.lint.flake8-quotes]
multiline-quotes = "double"
avoid-escape = false
inline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
