extends = "_common"

[rgbd_camera]
type = "ZedOneRgbCamera"
camera_resolution = "RES_1920x1200"
camera_fps = 60
video_bitrate_kbps = 30000

[field_filter]
type = "HomographyFieldFilter"
field_size_x = 2.35
field_size_y = 2.35

[keypoint_filter.height]
reject_enable = false

[keypoint_filter.static]
enable = true

[field_model]
type = "DeepLabMaskModel"

[field_model.engine]
candidates = ["data/models/field_deeplabv3p_r50_2026-07-29_aarch64_sm87.engine"]

[keypoint_model]
type = "YoloKeypointModel"
label_indices = ["MR_STABS_MK2", "MRS_BUFF_MK3", "OPPONENT", "HOUSE_BOT"]
threshold = 0.5

[keypoint_model.engine]
candidates = [
  "data/models/yolo26l-pose_all_keypoints_2026-09-25_rect416x640_aarch64_sm87.engine",
]

[mcap]
enable = true

[health]
tegrastats_enable = true
