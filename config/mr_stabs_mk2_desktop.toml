extends = "_desktop"

[robot_filter.label_mapping]
"MRS_BUFF_MK3" = ["THEIR_ROBOT_1"]
"MR_STABS_MK2" = ["OUR_ROBOT_1"]

[navigation]
type = "PursuitNavigation"
angular_kp = 0.06
angular_kd = 0.005
max_linear_command = 0.25
angle_threshold = 1.7
velocity_ramp_far_distance = 1.5
velocity_ramp_near_distance = 1.0
velocity_ramp_min_scale = 0.35
wall_reverse_distance_m = 0.25
wall_heading_threshold_rad = 1.047

[transmitter]
from = "transmitters/mr_stabs_mk2_opentx"

[plant]
from = "robots/mr_stabs_mk2"
