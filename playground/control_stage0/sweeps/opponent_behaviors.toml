# Opponent-behavior sweep: fixed start (-0.6,-0.6) and 60 ms latency, vary how the opponent moves.
# Shows how the no-prediction pursuit controller copes with static vs moving targets.
# Run: python playground/control_stage0/sim_sweep.py --sweep playground/control_stage0/sweeps/opponent_behaviors.toml --out playground/control_stage0/sweep_out/opponent_behaviors

[[runs]]
name = "static"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "static", start_pos = [0.5, 0.5] }]

[[runs]]
name = "straight"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "straight", start_pos = [-0.8, 0.6], heading_deg = 0.0, speed = 1.0 }]

[[runs]]
name = "circle"
[runs.sim]
"latency.command_ms" = 60.0
opponents = [{ behavior = "circle", radius = 0.6, speed = 1.2 }]

[[runs]]
name = "randomwalk"
[runs.sim]
"latency.command_ms" = 60.0
"sim.seed" = 1
opponents = [{ behavior = "random_walk", speed = 1.0 }]
