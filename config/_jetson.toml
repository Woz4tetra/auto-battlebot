# Jetson hardware profile (aarch64 TensorRT engines). Inherits the shared perception/filter stack
# from common.toml and overrides the hardware-specific bits.
extends = "_common"

[field_model]
type = "DeepLabMaskModel"
model_path = "data/models/field_deeplabv3p_r50_2026-04-29_aarch64_sm87.engine"

[robot_mask_model]
type = "YoloSegRobotBlobModel"
model_path = "data/models/yolo26n-seg_nhrl_robots_2026-04-27_aarch64_sm87.engine"
label_indices = [
  "OPPONENT",
  "OPPONENT",
  "HOUSE_BOT",
  "MR_STABS_MK2",
  "MRS_BUFF_MK3",
]
neutral_robot_labels = ["HOUSE_BOT"]
field_labels = ["FIELD"]
confidence_threshold = 0.6
debug_visualization = false

[keypoint_model]
type = "YoloKeypointModel"
model_path = "data/models/yolo26n-pose_our_robots_2026-05-01_aarch64_sm87.engine"

[navigation]
type = "PursuitNavigation"
angular_kp = 0.4
angular_kd = 0.01
angle_threshold = 1.7
velocity_ramp_far_distance = 1.5
velocity_ramp_near_distance = 0.5
velocity_ramp_min_scale = 0.35
wall_reverse_distance = 0.25      # set > 0 to reverse when within this distance of any wall
wall_heading_threshold = 1.047    # ~60 deg; heading must point toward wall to trigger reversal
max_linear_x = 0.75               # 0 = no limit
max_angular_z = 0.0               # 0 = no limit

[transmitter]
type = "OpenTxTransmitter"
wheel_track_width = 0.195
max_motor_rpm = 1500            # RPM
wheel_diameter = 0.05
lifted_deadzone_percent = 10
zero_deadzone_percent = 2
reverse_angular_channel = true
velocity_saturation_limit = 1.0 # 0 = disabled; e.g. 1.0 = |linear| + |angular| <= 1

[ui]
enable = true
fullscreen = true
battery_source = "Waveshare UPS"

[mcap]
enable = true

[health]
tegrastats_enable = true
