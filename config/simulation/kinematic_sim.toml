extends = "simulation/_simulation"

[field_model]
type = "FixedMaskModel"

[robot_mask_model]
type = "NoopRobotBlobModel"

[field_filter]
type = "FixedFieldFilter"
size_x = 2.4
size_y = 2.4

[keypoint_model]
type = "NoopKeypointModel"

[robot_filter]
type = "GroundTruthRobotFilter"

[navigation]
type = "PursuitNavigation"
angular_kp = 0.4
angular_kd = 0.01
angle_threshold = 1.7
velocity_ramp_far_distance = 1.5
velocity_ramp_near_distance = 0.5
velocity_ramp_min_scale = 0.5
max_linear_command = 1.0
stop_distance_m = 0.0
wall_reverse_distance_m = 0.25
wall_heading_threshold_rad = 1.047

[transmitter]
init_delay_seconds = 0.0

[runner]
max_loop_rate_hz = 0.0

[mcap]
enable = false

[clock]
type = "ManualClock"
