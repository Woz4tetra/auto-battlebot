# Mr Stabs Mk2 mass properties and tag frames. Generated; do not edit by hand.
# Regenerate: python playground/calibration/lump_mr_stabs_mass_properties.py
# Tag frames: T_body_tag maps OpenCV marker-frame points (origin at the tag center,
# x right and y up in the printed image, z out of the face) into the body frame.
# rotation is R_body_tag, row-major. upside_down = true for the tag that faces the
# floor when the robot is upright. Found by rendering each CAD face and decoding it.

