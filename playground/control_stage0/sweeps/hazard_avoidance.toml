# Hazard avoidance, static and moving, against no-hazard baselines.
#
# Read in results.csv:
#   fell_in            0 or the run is a loss
#   min_clearance_m    negative means the chassis was inside a hazard
#   time_lost_s        cost of avoidance against the run named in `baseline`
#   min_dist_m         did it still do its job (reach the opponent, or reach the safe point)
#
# The last one carries the weight: an avoidance layer that never moves scores perfectly on the
# first two and is useless.
#
# Run: python playground/control_stage0/sim_sweep.py \
#        --sweep playground/control_stage0/sweeps/hazard_avoidance.toml \
#        --sim-config simulation/sim_mrs_buff_mk3.toml \
#        --out playground/control_stage0/sweep_out/hazard_avoidance

sim_config = "simulation/sim_mrs_buff_mk3.toml"

# --- ATTACK across a static hole -------------------------------------------------------------

[[runs]]
name = "attack_clean"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.9, 0.9] }]
[runs.cpp]
"transmitter.behavior_mode" = "ATTACK"
"navigation.type" = "MotionProfileNavigation"

[[runs]]
name = "attack_hole"
baseline = "attack_clean"
hazards = [{ kind = "hole", center = [0.0, 0.0], radius = 0.22 }]
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.9, 0.9] }]
[runs.cpp]
"transmitter.behavior_mode" = "ATTACK"
"navigation.type" = "MotionProfileNavigation"

# Opponent parked on the lip of the hole: the case that decides whether attack follows it in.
[[runs]]
name = "attack_opponent_on_lip"
baseline = "attack_clean"
hazards = [{ kind = "hole", center = [0.5, 0.5], radius = 0.25 }]
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.62, 0.62] }]
[runs.cpp]
"transmitter.behavior_mode" = "ATTACK"
"navigation.type" = "MotionProfileNavigation"

# --- RUN_AWAY with a static hole -------------------------------------------------------------

[[runs]]
name = "runaway_clean"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.6, 0.6] }]
[runs.cpp]
"transmitter.behavior_mode" = "RUN_AWAY"
"navigation.type" = "MotionProfileNavigation"

[[runs]]
name = "runaway_hole"
baseline = "runaway_clean"
hazards = [{ kind = "hole", center = [-0.3, -0.3], radius = 0.24 }]
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.6, 0.6] }]
[runs.cpp]
"transmitter.behavior_mode" = "RUN_AWAY"
"navigation.type" = "MotionProfileNavigation"

# --- The house bot: a moving hazard tracked at NEUTRAL ----------------------------------------
# The second [[opponents]] entry becomes NEUTRAL_ROBOT_1 (robot_filter.neutral_count = 1) and
# carries a hazard_radius, so the sim clamps the chassis out of it and the controller sees a
# TRACKED keep-out disc following its filtered velocity. hazard_radius is 0.106, the half-diagonal
# of the 0.15 x 0.15 m footprint GroundTruthRobotFilter reports: the tracked path has no shared
# geometry file, so both sides must derive the same radius from the robot itself.

[[runs]]
name = "housebot_static"
baseline = "attack_clean"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [
  { behavior = "static", start_pos = [0.9, 0.9] },
  { behavior = "static", start_pos = [0.0, 0.0], hazard_radius = 0.106 },
]
[runs.cpp]
"transmitter.behavior_mode" = "ATTACK"
"navigation.type" = "MotionProfileNavigation"
"robot_filter.neutral_count" = 1
"runner.default_opponent_count" = 1

[[runs]]
name = "housebot_crossing"
baseline = "attack_clean"
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [
  { behavior = "static", start_pos = [0.9, 0.9] },
  { behavior = "circle", start_pos = [0.0, 0.4], speed = 0.5, radius = 0.4, hazard_radius = 0.106 },
]
[runs.cpp]
"transmitter.behavior_mode" = "ATTACK"
"navigation.type" = "MotionProfileNavigation"
"robot_filter.neutral_count" = 1
"runner.default_opponent_count" = 1

# --- Both hazard kinds at once ----------------------------------------------------------------

[[runs]]
name = "hole_and_block"
baseline = "attack_clean"
hazards = [
  { kind = "hole", center = [-0.1, 0.1], radius = 0.20 },
  { kind = "wall_block", center = [0.35, 0.2], radius = 0.16 },
]
[runs.sim]
"our_robot.start_pos" = [-0.9, -0.9]
"our_robot.start_yaw_deg" = 45.0
opponents = [{ behavior = "static", start_pos = [0.9, 0.9] }]
[runs.cpp]
"transmitter.behavior_mode" = "ATTACK"
"navigation.type" = "MotionProfileNavigation"
