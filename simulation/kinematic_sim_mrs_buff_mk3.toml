# Fast headless kinematic sim config for MRS BUFF MK3 (simulation/kinematic_sim_server.py).
# Keep [arena] in sync with config/simulation/headless_sim.toml [field_filter].

[server]
host = "127.0.0.1"
port = 14882

[sim]
dt = 0.0333          # ~30 Hz sim time (matches the real controller rate)
max_ticks = 900      # 30 s
seed = 0

[arena]
width = 2.4
height = 2.4

[latency]
command_ms = 60.0
observation_ms = 0.0

[camera]
res_width = 16
res_height = 16
fov = 70.0
pos = [0.0, -1.5, 0.6]
lookat = [0.0, 0.0, 0.0]

[our_robot]
start_pos = [-0.9, -0.9]
start_yaw_deg = 45.0
radius = 0.11
# MRS BUFF MK3 plant: UNCALIBRATED placeholder. Run playground/calibration/fit_plant_calib.py on a
# Mrs Buff Mk3 AprilTag drive recording and paste the fitted [our_robot] block here (fwd/rev speeds,
# accel/decel taus). Do not copy MR STABS MK2's numbers; the two drivetrains differ.
max_linear_speed = 2.0
max_angular_speed = 6.0
tau_linear = 0.15
tau_angular = 0.08

[perception]
pos_noise_std = 0.0
yaw_noise_std = 0.0
dropout_prob = 0.0

[perception.projection_bias]
enabled = false
keypoint_height = 0.06

[[opponents]]
behavior = "static"
start_pos = [0.0, 0.0]
speed = 1.0
heading_deg = 180.0
radius = 0.5
replay_csv = ""
